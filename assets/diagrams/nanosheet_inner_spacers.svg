<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Nanosheet inner spacers: a section along the channels</title><desc id="desc">Retained sheets join source and drain. Dielectric inner spacers separate gate material between sheets from the source/drain ends. Gate dielectric coats the channels in the gate region.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17334a"/></marker></defs><rect width="1200" height="720" fill="white"/>

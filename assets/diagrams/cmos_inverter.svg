<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">CMOS inverter: complementary pull-up and pull-down</title><desc id="desc">Input drives pMOS and nMOS gates. pMOS connects output toward VDD; nMOS toward ground. An output capacitance is shown at the shared node.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17334a"/></marker></defs><rect width="1200" height="720" fill="white"/>

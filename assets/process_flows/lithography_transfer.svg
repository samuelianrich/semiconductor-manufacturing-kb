<text x="145" y="445" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17334a" text-anchor="start">Silicon</text>
<line x1="375" y1="380" x2="420" y2="380" stroke="#17334a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="440" y="170" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17334a" text-anchor="start">2. Transfer into oxide</text>
<rect x="440" y="380" width="320" height="110" rx="0" fill="#d0e6ec" stroke="#17334a" stroke-width="2"/>

<text x="540" y="445" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17334a" text-anchor="start">Silicon</text>
<line x1="770" y1="380" x2="815" y2="380" stroke="#17334a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="835" y="170" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17334a" text-anchor="start">3. Strip resist</text>

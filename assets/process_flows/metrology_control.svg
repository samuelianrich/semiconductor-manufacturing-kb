<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Measurement → evidence → process decision</title><desc id="desc">Measurement is interpreted with model and sampling context before comparing specifications and statistical baseline, investigating excursions and deciding disposition.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17334a"/></marker></defs><rect width="1200" height="720" fill="white"/>
<text x="40" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17334a" text-anchor="start">Measurement → evidence → process decision</text>
<text x="40" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#506575" text-anchor="start">Conceptual schematic • not to scale • original illustration</text>
<text x="40" y="675" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506575" text-anchor="start">Source basis: NIST-SPC-001; NIST-CAPABILITY-001; NIST-ELLIPSO-001</text>
<text x="40" y="703" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#506575" text-anchor="start">Semiconductor Manufacturing Knowledge Base • CC BY 4.0</text>
<rect x="30" y="180" width="255" height="170" rx="8" fill="#d0e6ec" stroke="#17334a" stroke-width="2"/>
<text x="46" y="212" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17334a" text-anchor="start">Define measurand</text>
<text x="46" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#506575" text-anchor="start">Property / units /</text>
<text x="46" y="325" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#506575" text-anchor="start">sites</text>
<line x1="285" y1="265" x2="315" y2="265" stroke="#17334a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="330" y="180" width="255" height="170" rx="8" fill="#d0e6ec" stroke="#17334a" stroke-width="2"/>
<text x="346" y="212" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17334a" text-anchor="start">Measure + calibrate</text>
<text x="346" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#506575" text-anchor="start">Method / uncertainty</text>
<line x1="585" y1="265" x2="615" y2="265" stroke="#17334a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="630" y="180" width="255" height="170" rx="8" fill="#f3f7fa" stroke="#17334a" stroke-width="2"/>
<text x="646" y="212" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17334a" text-anchor="start">Interpret evidence</text>
<text x="646" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#506575" text-anchor="start">Model / sample limits</text>
<line x1="885" y1="265" x2="915" y2="265" stroke="#17334a" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="930" y="180" width="255" height="170" rx="8" fill="#f3f7fa" stroke="#17334a" stroke-width="2"/>
<text x="946" y="212" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17334a" text-anchor="start">Decide disposition</text>
<text x="946" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#506575" text-anchor="start">Accept or investigate</text>
<rect x="85" y="450" width="465" height="150" rx="8" fill="#f2b562" stroke="#17334a" stroke-width="2"/>
<text x="101" y="482" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17334a" text-anchor="start">Product specification</text>
<text x="101" y="550" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#506575" text-anchor="start">Does measured output meet a requirement?</text>
<rect x="655" y="450" width="465" height="150" rx="8" fill="#d0e6ec" stroke="#17334a" stroke-width="2"/>
<text x="671" y="482" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17334a" text-anchor="start">Statistical control limits</text>
<text x="671" y="550" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#506575" text-anchor="start">Does behavior differ from the baseline?</text>
<text x="280" y="410" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17334a" text-anchor="start">These are different questions; passing one does not imply the other.</text></svg>

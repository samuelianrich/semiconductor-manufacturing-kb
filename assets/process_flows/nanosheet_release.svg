<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Nanosheets: sacrificial layers become gate access</title><desc id="desc">Three transverse channel sections show alternating retained silicon and sacrificial SiGe, released silicon sheets and an insulated surrounding gate. Source/drain anchors are outside this section.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17334a"/></marker></defs><rect width="1200" height="720" fill="white"/>

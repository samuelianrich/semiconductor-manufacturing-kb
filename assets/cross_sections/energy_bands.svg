<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Energy bands: allowed states and mobile carriers</title><desc id="desc">Energy is vertical. A conduction electron and a valence-band hole are shown as an excitation across the band gap; the gap is not physical empty space.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17334a"/></marker></defs><rect width="1200" height="720" fill="white"/>
<text x="40" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#17334a" text-anchor="start">Energy bands: allowed states and mobile carriers</text>
<text x="40" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#506575" text-anchor="start">Conceptual schematic • not to scale • original illustration</text>
<text x="40" y="675" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#506575" text-anchor="start">Source basis: HU-PHYSICS-001; MIT-CARRIERS-001</text>
<text x="40" y="703" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#506575" text-anchor="start">Semiconductor Manufacturing Knowledge Base • CC BY 4.0</text>
<line x1="130" y1="580" x2="130" y2="175" stroke="#17334a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="55" y="150" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17334a" text-anchor="start">Energy</text>
<rect x="235" y="180" width="640" height="140" rx="8" fill="#d0e6ec" stroke="#d0e6ec" stroke-width="2"/>
<rect x="235" y="445" width="640" height="130" rx="8" fill="#c4d6ee" stroke="#c4d6ee" stroke-width="2"/>
<line x1="235" y1="320" x2="875" y2="320" stroke="#17334a" stroke-width="3"/>
<line x1="235" y1="445" x2="875" y2="445" stroke="#17334a" stroke-width="3"/>
<text x="910" y="326" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17334a" text-anchor="start">Ec</text>
<text x="910" y="451" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#17334a" text-anchor="start">Ev</text>
<text x="285" y="220" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17334a" text-anchor="start">Conduction band</text>
<text x="285" y="545" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17334a" text-anchor="start">Valence band</text>
<line x1="560" y1="475" x2="560" y2="278" stroke="#17334a" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="560" cy="266" r="12" fill="#007c83"/>
<ellipse cx="560" cy="484" rx="12" ry="12" fill="white" stroke="#ba4661" stroke-width="2"/>
<text x="595" y="275" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17334a" text-anchor="start">Electron</text>
<text x="595" y="490" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17334a" text-anchor="start">Hole</text>
<text x="285" y="390" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17334a" text-anchor="start">Band gap Eg = Ec − Ev</text>
<text x="60" y="625" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17334a" text-anchor="start">The vertical axis is energy. This is not a drawing of physical layers or a crack in the wafer.</text></svg>

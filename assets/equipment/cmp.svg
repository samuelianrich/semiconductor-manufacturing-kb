<line x1="275" y1="190" x2="275" y2="268" stroke="#17334a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="345" y1="190" x2="345" y2="268" stroke="#17334a" stroke-width="3" marker-end="url(#arrow)"/>
